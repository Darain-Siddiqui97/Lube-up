<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12345a">
  <title>LUBE UP LUBE 40 | Original Product</title>
  <meta name="description" content="LUBE UP LUBE 40 High Performance Engine Oil, SAE 20W50, API SF, 700ml.">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f6f9;color:#172235;font-family:Arial,Helvetica,sans-serif}
    main{max-width:620px;margin:28px auto;padding:18px}
    .card{background:#fff;border:1px solid #e5e9ef;border-radius:22px;overflow:hidden;box-shadow:0 12px 35px rgba(16,38,66,.09)}
    .photo{background:#fff;padding:14px}
    .photo img{display:block;width:100%;height:auto;max-height:680px;object-fit:contain}
    .details{padding:22px 24px 26px}
    .tag{display:inline-block;background:#e8f5ec;color:#176b37;border-radius:30px;padding:8px 13px;font-size:12px;font-weight:800;letter-spacing:1.1px}
    h1{font-size:27px;margin:15px 0 6px;color:#12345a}
    .sub{margin:0 0 20px;color:#657187;line-height:1.5}
    .specs{border-top:1px solid #edf0f4}
    .spec{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid #edf0f4;font-size:15px}
    .spec span:first-child{color:#68758a}
    .spec strong{text-align:right;color:#172235}
    footer{text-align:center;color:#8993a2;font-size:12px;padding:18px}
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div class="photo">
        <img src="lube-up-lube-40.webp" alt="LUBE UP LUBE 40 engine oil bottle">
      </div>
      <div class="details">
        <span class="tag">ORIGINAL PRODUCT</span>
        <h1>LUBE UP – LUBE 40</h1>
        <p class="sub">High Performance Engine Oil</p>
        <div class="specs">
          <div class="spec"><span>Viscosity Grade</span><strong>SAE 20W50</strong></div>
          <div class="spec"><span>API Classification</span><strong>SF</strong></div>
          <div class="spec"><span>Quantity</span><strong>700ml</strong></div>
          <div class="spec"><span>Formulated in</span><strong>UAE</strong></div>
        </div>
      </div>
    </section>
    <footer>Product information as shown on the supplied packaging.</footer>
  </main>
</body>
</html>
