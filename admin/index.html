<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12345a"><title>LUBE UP — QR Admin Scanner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172235;font-family:Arial,sans-serif}
main{max-width:560px;margin:24px auto;padding:16px}.card{background:#fff;border:1px solid #e3e8ef;border-radius:18px;padding:20px;box-shadow:0 8px 28px #17385b12}
h1{margin:0 0 6px;color:#12345a;font-size:24px}.muted{color:#68758a;font-size:14px;line-height:1.5}
label{display:block;font-weight:700;font-size:13px;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #ccd5e1;border-radius:10px;font-size:16px}
button{border:0;border-radius:10px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;background:#12345a;color:white;width:100%;margin-top:12px}
button.secondary{background:#e9eef5;color:#12345a}video{width:100%;border-radius:12px;background:#101820;margin-top:14px;display:none}
.result{display:none;margin-top:16px;padding:16px;border-radius:12px;font-weight:700;line-height:1.5;overflow-wrap:anywhere}
.good{background:#e8f7ed;color:#176b37}.bad{background:#fff0ef;color:#a52822}.info{background:#eef3f9;color:#23415f}
small{color:#718096}.row{display:flex;gap:10px}.row button{flex:1}
</style></head>
<body><main>
<section class="card">
<h1>LUBE UP QR Verification</h1><p class="muted">Admin-only bottle verification. Each bottle QR can be redeemed once globally.</p>
<label for="key">Admin key</label><input id="key" type="password" autocomplete="current-password" placeholder="Enter admin key">
<label for="mechanic">Mechanic name</label><input id="mechanic" maxlength="80" placeholder="Enter mechanic name">
<div class="row"><button id="start">Start camera</button><button id="stop" class="secondary">Stop</button></div>
<video id="video" playsinline></video>
<div id="result" class="result" role="status"></div>
<p class="muted">Camera scanning requires HTTPS and browser permission. If the browser does not support native QR detection, use a supported modern Chrome browser.</p>
</section></main>
<script>
const keyEl=document.getElementById('key'), nameEl=document.getElementById('mechanic'), video=document.getElementById('video'), result=document.getElementById('result');
let stream=null, detector=null, busy=false, lastValue='';
function show(type,text){result.className='result '+type;result.textContent=text;result.style.display='block'}
function extractToken(raw){
  try { const u=new URL(raw); const t=u.searchParams.get('qr')||u.searchParams.get('token'); if(t)return t; }
  catch {}
  return raw.trim();
}
async function stopCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;video.style.display='none'}
async function verify(raw){
  if(busy)return;busy=true;
  const mechanicName=nameEl.value.trim(), token=extractToken(raw);
  if(mechanicName.length<2){show('bad','Enter mechanic name before scanning.');busy=false;return}
  try{
    const res=await fetch('/api/verify',{method:'POST',headers:{'content-type':'application/json','x-admin-key':keyEl.value},body:JSON.stringify({token,mechanicName})});
    const data=await res.json();
    if(data.ok)show('good','✓ '+data.message+' Product: '+data.scan.product+' | Mechanic: '+data.scan.mechanic+' | Reward: Rs. '+data.scan.reward);
    else show('bad',data.message||'Verification failed.');
  }catch(e){show('bad','Network error. Please try again.')}
  finally{busy=false}
}
document.getElementById('start').onclick=async()=>{
  if(!keyEl.value){show('bad','Enter admin key first.');return}
  if(!nameEl.value.trim()){show('bad','Enter mechanic name first.');return}
  if(!('BarcodeDetector' in window)){show('bad','This browser does not support built-in QR scanning. Try latest Chrome on Android.');return}
  try{
    detector=new BarcodeDetector({formats:['qr_code']});
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    video.srcObject=stream;video.style.display='block';await video.play();
    const scanFrame=async()=>{
      if(!stream)return;
      if(!busy){try{const codes=await detector.detect(video);if(codes.length&&codes[0].rawValue&&codes[0].rawValue!==lastValue){lastValue=codes[0].rawValue;await verify(lastValue);setTimeout(()=>{lastValue=''},1800)}}catch{}}
      if(stream)requestAnimationFrame(scanFrame);
    };scanFrame();
  }catch(e){show('bad','Camera could not start. Allow camera permission and use HTTPS.')}
};
document.getElementById('stop').onclick=stopCamera;
</script></body></html>
